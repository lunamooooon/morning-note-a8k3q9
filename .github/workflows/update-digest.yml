name: Update daily finance digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: python -m pip install -r requirements.txt

      - run: python digest.py --site --timeout 10

      - run: |
          cp site/index.html docs/index.html
          cp site/icon.svg docs/icon.svg
          cp site/manifest.webmanifest docs/manifest.webmanifest
          cp site/.nojekyll docs/.nojekyll

      - run: |
          git config user.name "Finance Digest"
          git config user.email "finance-digest@example.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update daily finance digest"
            git push
          fi
